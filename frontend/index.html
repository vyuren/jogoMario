<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Mario</title>
  </head>
  <body>
    <div class="game-board">
      <div class="score">
        <img src="./assets/coin.png" />
        <span>0</span>
      </div>

      <img src="./assets/mario.gif" class="mario" />
      <img src="./assets/pipe.png" class="pipe" />
      <img src="./assets/clouds.png" class="clouds" />
      <img src="./assets/coin.png" class="coin" />

      <div class="game-over">
        <h1>GAME OVER</h1>
        <p>Você fez <span class="final-score">0</span> moedas!</p>
        <button class="restart-button">Jogar novamente</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
